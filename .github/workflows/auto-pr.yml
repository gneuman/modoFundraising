name: Auto PR

on:
  push:
    branches-ignore:
      - master
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH"
            exit 0
          fi

          # Titulo = primer commit del branch, o ultimo si es merge
          FIRST_COMMIT=$(git log origin/main..HEAD --pretty=%s --no-merges | tail -1)
          if [ -z "$FIRST_COMMIT" ]; then
            FIRST_COMMIT=$(git log -1 --pretty=%s)
          fi

          # Detectar tipo desde el commit conventional (feat:, fix:, docs: ...)
          # Fallback: prefijo del branch. Ultimo fallback: 'change'.
          COMMIT_TYPE=$(echo "$FIRST_COMMIT" | grep -oE '^(feat|fix|chore|docs|refactor|test|perf|style|build|ci|revert)' | head -1)
          if [ -n "$COMMIT_TYPE" ]; then
            case "$COMMIT_TYPE" in
              feat) EMOJI="feat"; KIND="Nueva funcionalidad";;
              fix) EMOJI="fix"; KIND="Bug fix";;
              chore) EMOJI="chore"; KIND="Mantenimiento";;
              docs) EMOJI="docs"; KIND="Documentacion";;
              refactor) EMOJI="refactor"; KIND="Refactor";;
              test) EMOJI="test"; KIND="Tests";;
              perf) EMOJI="perf"; KIND="Performance";;
              style) EMOJI="style"; KIND="Estilo";;
              build) EMOJI="build"; KIND="Build";;
              ci) EMOJI="ci"; KIND="CI/CD";;
              revert) EMOJI="revert"; KIND="Revert";;
            esac
          else
            # Fallback al prefijo del branch (para branches sin conventional commits)
            PREFIX="${BRANCH%%/*}"
            case "$PREFIX" in
              feature|feat) EMOJI="feat"; KIND="Nueva funcionalidad";;
              fix|bug|hotfix) EMOJI="fix"; KIND="Bug fix";;
              chore) EMOJI="chore"; KIND="Mantenimiento";;
              docs) EMOJI="docs"; KIND="Documentacion";;
              refactor) EMOJI="refactor"; KIND="Refactor";;
              test) EMOJI="test"; KIND="Tests";;
              *) EMOJI="change"; KIND="Cambio";;
            esac
          fi

          TITLE="[$EMOJI] $FIRST_COMMIT"

          # Contexto para el body
          COMMITS=$(git log origin/main..HEAD --pretty=format:'- %s' --no-merges | head -20)
          FILES=$(git diff --stat origin/main...HEAD | tail -1)
          FILE_LIST=$(git diff --name-only origin/main...HEAD | head -15)

          BODY=$(cat <<EOF
          ## Que es esto

          **Tipo:** $KIND
          **Branch:** \`$BRANCH\`
          **Resumen:** $FIRST_COMMIT

          ## Cambios en este PR

          $COMMITS

          ## Archivos modificados

          \`\`\`
          $FILES
          \`\`\`

          <details>
          <summary>Ver lista de archivos</summary>

          \`\`\`
          $FILE_LIST
          \`\`\`

          </details>

          ## Que tienes que hacer

          1. **Revisar el diff** en la pestana "Files changed" arriba.
          2. **Correr en local si toca UI/logica:** \`npm run build\` y \`npm run dev\` para verificar.
          3. **Si todo bien:** click "Merge pull request" (o "Squash and merge" si prefieres commits limpios en main).
          4. **Si algo esta mal:** agrega commits al branch \`$BRANCH\` — este PR se actualiza solo.

          ---
          _PR abierto automaticamente por [.github/workflows/auto-pr.yml](.github/workflows/auto-pr.yml)_
          EOF
          )

          # --assignee: sin esto el PR lo abre el bot y GitHub NO notifica a
          # nadie. Se acumularon 24 PRs sin que Gabriel se enterara — el mas
          # viejo 24 dias. Asignarselo lo pone en su bandeja "Assigned" y le
          # manda correo.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee gneuman

      # Aviso a Slack. Solo corre si SLACK_BOT_TOKEN esta cargado como secret
      # del repo (Settings -> Secrets -> Actions). Sin el, el paso se salta sin
      # fallar: el PR ya quedo creado y asignado, que es lo que importa.
      - name: Avisar en Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_LINEAR }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Sin el secret cargado no hay nada que hacer. Se sale en verde: el PR
          # ya quedo creado y asignado, que es lo que de verdad importa.
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN no configurado — se omite el aviso."
            exit 0
          fi

          PR_URL=$(gh pr view "$BRANCH" --json url --jq .url 2>/dev/null) || exit 0
          PR_NUM=$(gh pr view "$BRANCH" --json number --jq .number)
          PR_TITLE=$(gh pr view "$BRANCH" --json title --jq .title)

          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n \
              --arg ch "${SLACK_CHANNEL:-#general}" \
              --arg txt "PR #${PR_NUM} listo para revisar: <${PR_URL}|${PR_TITLE}>" \
              '{channel: $ch, text: $txt, unfurl_links: false}')" \
            > /dev/null || true
